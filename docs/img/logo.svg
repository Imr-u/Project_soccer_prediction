<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Soccer ball with checkmark logo" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <clipPath id="ball">
      <circle cx="100" cy="100" r="84"/>
    </clipPath>
    <path id="pent" d="M0,-18 L17.12,-5.56 L10.58,14.56 L-10.58,14.56 L-17.12,-5.56 Z"/>
  </defs>

  <!-- Navy outer ring -->
  <circle cx="100" cy="100" r="98" fill="#0f172a"/>

  <!-- White ball -->
  <circle cx="100" cy="100" r="84" fill="#ffffff"/>

  <!-- Five bold green rim patches, clipped to the ball -->
  <g clip-path="url(#ball)" fill="#22c55e">
    <g transform="translate(100,100)">
      <g transform="translate(0,-84) scale(1.5)"><use href="#pent"/></g>
      <g transform="rotate(72) translate(0,-84) scale(1.5)"><use href="#pent"/></g>
      <g transform="rotate(144) translate(0,-84) scale(1.5)"><use href="#pent"/></g>
      <g transform="rotate(216) translate(0,-84) scale(1.5)"><use href="#pent"/></g>
      <g transform="rotate(288) translate(0,-84) scale(1.5)"><use href="#pent"/></g>
    </g>
  </g>

  <!-- Bold checkmark: the confirmed, high-probability pick -->
  <path d="M62 104 L90 132 L140 72" fill="none" stroke="#0f172a" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
